openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Telecart shop administration. Live Telegram and payments are not connected.
servers:
  - url: /api
tags:
  - name: health
  - name: shop
paths:
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [shop]
      responses:
        "200":
          description: Current admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCredentials" }
      responses:
        "200":
          description: Admin signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { description: Invalid credentials }
        "429": { description: Too many attempts }
  /admin/logout:
    post:
      operationId: logoutAdmin
      tags: [shop]
      responses:
        "204": { description: Session revoked }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /shop/overview:
    get:
      operationId: getOverview
      tags: [shop]
      responses:
        "200":
          description: Shop overview or explicitly labelled public sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
  /shop/products:
    get:
      operationId: listProducts
      tags: [shop]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }
    post:
      operationId: createProduct
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /shop/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateProduct
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [shop]
      responses:
        "204": { description: Deleted }
  /shop/products/{id}/inventory:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: listInventory
      tags: [shop]
      responses:
        "200":
          description: Metadata only, no plaintext credentials
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InventoryItem" } }
    post:
      operationId: importInventory
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryInput" }
      responses:
        "201":
          description: Imported securely
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
  /shop/inventory/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      operationId: deleteInventoryItem
      tags: [shop]
      responses:
        "204": { description: Deleted }
  /shop/orders:
    get:
      operationId: listOrders
      tags: [shop]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
  /shop/orders/{id}/delivery:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revealOrderDelivery
      tags: [shop]
      responses:
        "200":
          description: Exact delivered inventory, visible only to the owning admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDelivery" }
        "400": { description: Invalid order reference }
        "401": { description: Sign-in required }
        "403": { description: Cross-origin access denied }
        "404": { description: Delivered inventory unavailable }
  /shop/customers:
    get:
      operationId: listCustomers
      tags: [shop]
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Customer" } }
  /shop/deposits:
    get:
      operationId: listDeposits
      tags: [shop]
      responses:
        "200":
          description: Deposits
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Deposit" } }
  /shop/deposits/{id}/cancel:
    post:
      operationId: cancelDeposit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled the deposit flow without stopping verification of late transfers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositCancellation" }
        "400": { description: Invalid deposit reference }
        "401": { description: Sign in required }
        "404": { description: Deposit not found in this shop }
        "409": { description: Deposit is already settled or closed }
  /shop/data-transfer:
    get:
      operationId: getShopTransferStatus
      responses:
        "200":
          description: Destination readiness and safety requirements.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopTransferStatus" }
        "401": { description: Sign in required }
  /shop/data-transfer/export:
    post:
      operationId: exportShopData
      responses:
        "200":
          description: One-time portable shop data ZIP.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { description: Sign in required }
        "413": { description: Transfer limit exceeded }
  /shop/data-transfer/preview:
    post:
      operationId: previewShopData
      requestBody:
        required: true
        content:
          application/zip:
            schema: { $ref: "#/components/schemas/ShopTransferZip" }
      responses:
        "200":
          description: Verified ZIP contents and destination blockers. No rows changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopTransferPreview" }
        "400": { description: Invalid or unauthenticated archive }
        "401": { description: Sign in required }
        "413": { description: ZIP exceeds transfer limit }
  /shop/data-transfer/import:
    post:
      operationId: importShopData
      parameters:
        - { name: X-Transfer-Token, in: header, required: true, schema: { type: string } }
        - { name: X-Transfer-Confirm, in: header, required: true, schema: { type: string, enum: [IMPORT EMPTY SHOP] } }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { $ref: "#/components/schemas/ShopTransferZip" }
      responses:
        "200":
          description: All records imported atomically; processing paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopTransferResult" }
        "400": { description: Invalid archive or missing confirmation }
        "401": { description: Sign in required }
        "409": { description: "Nonempty destination, expired preview or conflict. No changes committed." }
        "413": { description: ZIP exceeds transfer limit }
  /shop/data-transfer/review:
    post:
      operationId: reviewShopData
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopTransferReview" }
      responses:
        "200":
          description: Review acknowledged; Telegram remains disabled until explicitly enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopTransferReviewResult" }
        "400": { description: Acknowledgement required }
        "401": { description: Sign in required }
  /shop/activity:
    get:
      operationId: listActivity
      tags: [shop]
      responses:
        "200":
          description: Recent shop events
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Activity" } }
  /shop/settings:
    get:
      operationId: getSettings
      tags: [shop]
      responses:
        "200":
          description: Nonsecret settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopSettings" }
    put:
      operationId: saveSettings
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopSettings" }
  /shop/integration:
    get:
      operationId: getIntegration
      responses:
        "200":
          description: Safe connection diagnostics for the signed-in shop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationStatus" }
  /shop/integration/runtime:
    post:
      operationId: updateTelegramRuntime
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramRuntimeInput" }
      responses:
        "200":
          description: Saved Telegram operation settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationStatus" }
  /shop/integration/credentials/telegram:
    post:
      operationId: saveTelegramCredential
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramCredentialInput" }
      responses:
        "200":
          description: Token was verified with Telegram and encrypted for the signed-in shop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramCredentialResult" }
  /shop/integration/credentials/nowpayments:
    post:
      operationId: saveNowpaymentsCredentials
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NOWPaymentsCredentialInput" }
      responses:
        "200":
          description: API key was verified and both values were encrypted for the signed-in shop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NOWPaymentsCredentialResult" }
  /shop/payment-minimums:
    get:
      operationId: getPaymentMinimums
      tags: [shop]
      responses:
        "200":
          description: Current provider minimums for this merchant route
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMinimum" }
  /shop/integration/connect:
    post:
      operationId: connectIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationInput" }
      responses:
        "200":
          description: Verified provider configuration and current Telegram activation state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationStatus" }
  /shop/integration/disconnect:
    post:
      operationId: disconnectIntegration
      responses:
        "204": { description: Telegram disconnected; pending payments remain reconcilable. }
  /shop/payment-attempts:
    get:
      operationId: listPaymentAttempts
      responses:
        "200":
          description: Real payment attempts, with no delivered credentials.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentAttempt" }
  /shop/payment-attempts/{id}/check:
    post:
      operationId: checkPaymentAttempt
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authoritatively checked with NOWPayments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentAttempt" }
components:
  schemas:
    PaymentMinimum:
      type: object
      required: [coin, fixedUSD, floatingUSD, checkedAt]
      properties:
        coin: { type: string }
        fixedUSD: { type: ["number", "null"] }
        floatingUSD: { type: ["number", "null"] }
        checkedAt: { type: string }
    AdminCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    AdminSession:
      type: object
      required: [signedIn, ownerId, email]
      properties:
        signedIn: { type: boolean }
        ownerId: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Overview:
      type: object
      required: [isDemo, revenue, orderCount, customerCount, walletBalance, productCount, stockCount, pendingPayments, botConnected, paymentsConnected, recentOrders, topProducts, checklist]
      properties:
        isDemo: { type: boolean }
        revenue: { type: number }
        orderCount: { type: integer }
        customerCount: { type: integer }
        walletBalance: { type: number }
        productCount: { type: integer }
        stockCount: { type: integer }
        pendingPayments: { type: integer }
        botConnected: { type: boolean }
        paymentsConnected: { type: boolean }
        recentOrders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        topProducts: { type: array, items: { $ref: "#/components/schemas/Product" } }
        checklist: { type: array, items: { $ref: "#/components/schemas/ChecklistItem" } }
    ChecklistItem:
      type: object
      required: [label, complete, href]
      properties:
        label: { type: string }
        complete: { type: boolean }
        href: { type: string }
    ProductInput:
      type: object
      additionalProperties: false
      required: [name, description, category, price, status, deliveryFormat]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 80 }
        price: { type: number, minimum: 0.01, maximum: 100000 }
        status: { type: string, enum: [active, draft, archived] }
        deliveryFormat: { type: string, enum: ["email:pass", "user:pass"] }
    Product:
      type: object
      required: [id, name, description, category, price, status, deliveryFormat, stock, sold, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        status: { type: string, enum: [active, draft, archived] }
        deliveryFormat: { type: string, enum: ["email:pass", "user:pass"] }
        stock: { type: integer }
        sold: { type: integer }
        createdAt: { type: string }
    InventoryInput:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries: { type: string, minLength: 1, maxLength: 100000, description: "One login:password per line, maximum 500 lines. Credentials are encrypted server-side." }
    InventoryItem:
      type: object
      required: [id, productId, status, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        status: { type: string, enum: [available, reserved, delivered] }
        createdAt: { type: string }
    ImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
    Order:
      type: object
      required: [id, customer, productName, amount, status, paymentMethod, createdAt]
      properties:
        id: { type: string }
        customer: { type: string }
        productName: { type: string }
        amount: { type: number }
        status: { type: string, enum: [pending, paid, delivered, cancelled, refunded] }
        paymentMethod: { type: string }
        createdAt: { type: string }
    OrderDelivery:
      type: object
      required: [orderId, inventoryId, credential, deliveredAt]
      properties:
        orderId: { type: string }
        inventoryId: { type: integer }
        credential: { type: string }
        deliveredAt: { type: string }
    Customer:
      type: object
      required: [id, username, orderCount, spent, walletBalance, joinedAt]
      properties:
        id: { type: string }
        username: { type: string }
        telegramId: { type: ["string", "null"], description: "Telegram user ID, separate from their public username or display name." }
        orderCount: { type: integer }
        spent: { type: number }
        walletBalance: { type: number }
        joinedAt: { type: string }
    Deposit:
      type: object
      required: [id, customer, amount, currency, status, createdAt]
      properties:
        id: { type: string }
        customer: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [waiting, confirming, finished, failed, expired, cancelled] }
        cancelledAt: { type: ["string", "null"] }
        canCancel: { type: boolean }
        createdAt: { type: string }
    DepositCancellation:
      type: object
      required: [id, cancelledAt, telegramUpdatePending]
      properties:
        id: { type: string }
        cancelledAt: { type: string }
        telegramUpdatePending: { type: boolean }
    ShopTransferZip: { type: string, format: binary }
    ShopTransferCounts:
      type: object
      additionalProperties: { type: integer }
    ShopTransferStatus:
      type: object
      required: [empty, counts, blockers, reviewRequired, warnings]
      properties:
        empty: { type: boolean }
        counts: { $ref: "#/components/schemas/ShopTransferCounts" }
        blockers: { type: array, items: { type: string } }
        reviewRequired: { type: boolean }
        warnings: { type: array, items: { type: string } }
    ShopTransferPreview:
      type: object
      required: [createdAt, counts, archiveHash, confirmationToken, canImport, blockers, warnings]
      properties:
        createdAt: { type: string }
        counts: { $ref: "#/components/schemas/ShopTransferCounts" }
        archiveHash: { type: string }
        confirmationToken: { type: string }
        canImport: { type: boolean }
        blockers: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    ShopTransferResult:
      type: object
      required: [counts, reviewRequired]
      properties:
        counts: { $ref: "#/components/schemas/ShopTransferCounts" }
        reviewRequired: { type: boolean }
    ShopTransferReview:
      type: object
      required: [sourceStopped, recordsReviewed]
      properties:
        sourceStopped: { type: boolean }
        recordsReviewed: { type: boolean }
    ShopTransferReviewResult:
      type: object
      required: [reviewRequired]
      properties:
        reviewRequired: { type: boolean }
    Activity:
      type: object
      required: [id, title, description, type, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        type: { type: string }
        createdAt: { type: string }
    IntegrationInput:
      type: object
      additionalProperties: false
      required: [acknowledgePolicy]
      properties:
        acknowledgePolicy: { type: boolean, const: true }
    TelegramCredentialInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 512 }
    TelegramCredentialResult:
      type: object
      required: [verified, botUsername, saved, message]
      properties:
        verified: { type: boolean, const: true }
        botUsername: { type: string }
        saved: { type: boolean }
        message: { type: string }
    NOWPaymentsCredentialInput:
      type: object
      additionalProperties: false
      required: [apiKey, ipnSecret]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 512 }
        ipnSecret: { type: string, minLength: 1, maxLength: 512 }
    NOWPaymentsCredentialResult:
      type: object
      required: [verified, ipnSecretSaved]
      properties:
        verified: { type: boolean, const: true }
        ipnSecretSaved: { type: boolean, const: true }
    TelegramRuntimeInput:
      type: object
      additionalProperties: false
      required: [enabled, transport, publicUrl, acknowledgePolicy]
      properties:
        enabled: { type: boolean }
        transport: { type: string, enum: [polling, webhook] }
        publicUrl: { type: string, maxLength: 2048 }
        acknowledgePolicy: { type: boolean }
    IntegrationStatus:
      type: object
      required: [signedIn, ownerId, ownerBound, isOperator, tokenPresent, apiKeyPresent, ipnSecretPresent, telegramVerified, nowpaymentsVerified, telegramProcessingEnabled, telegramTransport, telegramRuntimeState, telegramRuntimeError, telegramLastCheckedAt, publicUrl, botUsername, connected, settlementStatus]
      properties:
        signedIn: { type: boolean }
        ownerId: { type: string }
        ownerBound: { type: boolean }
        isOperator: { type: boolean }
        tokenPresent: { type: boolean }
        apiKeyPresent: { type: boolean }
        ipnSecretPresent: { type: boolean }
        telegramVerified: { type: boolean }
        nowpaymentsVerified: { type: boolean }
        telegramProcessingEnabled: { type: boolean }
        telegramTransport: { type: string, enum: [polling, webhook] }
        telegramRuntimeState: { type: string, enum: [disabled, starting, running, error, webhook] }
        telegramRuntimeError: { type: string }
        telegramLastCheckedAt: { type: ["string", "null"] }
        publicUrl: { type: string }
        botUsername: { type: string }
        connected: { type: boolean }
        settlementStatus: { type: string, enum: [finished] }
    PaymentAttempt:
      type: object
      required: [id, kind, customer, productName, amount, currency, status, fulfillment, providerPaymentId, createdAt, payAmount, receivedAmount, lastCheckedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        customer: { type: string }
        productName: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string }
        fulfillment: { type: string }
        cancelledAt: { type: ["string", "null"] }
        canCancel: { type: boolean }
        providerPaymentId: { type: ["string", "null"] }
        payAmount: { type: ["string", "null"] }
        receivedAmount: { type: ["string", "null"] }
        lastCheckedAt: { type: ["string", "null"] }
        createdAt: { type: string }
    SettingsInput:
      type: object
      additionalProperties: false
      required: [shopName, botUsername, welcomeMessage, supportUsername, supportMessage, currency, minDeposit, acceptedCoins, invoiceExpiryMinutes, rateMode, maintenanceMode, productsLabel, supportLabel, walletLabel, ordersLabel]
      properties:
        shopName: { type: string, minLength: 1, maxLength: 100 }
        botUsername: { type: string, maxLength: 32, pattern: "^@?[A-Za-z0-9_]*$" }
        welcomeMessage: { type: string, minLength: 1, maxLength: 3000 }
        supportUsername: { type: string, maxLength: 32, pattern: "^@?[A-Za-z0-9_]*$" }
        supportMessage: { type: string, maxLength: 2000 }
        currency: { type: string, enum: [USD] }
        minDeposit: { type: number, minimum: 5, maximum: 100000, description: "Shop deposit minimum in USD, at least $5. Provider coin minimums may be higher." }
        acceptedCoins: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [BTC, ETH, LTC, USDTTRC20, USDTERC20, BNBBSC, SOL] } }
        rateMode: { type: string, enum: [fixed, floating] }
        invoiceExpiryMinutes: { type: integer, minimum: 10, maximum: 120 }
        maintenanceMode: { type: boolean }
        productsLabel: { type: string, minLength: 1, maxLength: 30 }
        supportLabel: { type: string, minLength: 1, maxLength: 30 }
        walletLabel: { type: string, minLength: 1, maxLength: 30 }
        ordersLabel: { type: string, minLength: 1, maxLength: 30 }
    ShopSettings:
      allOf:
        - { $ref: "#/components/schemas/SettingsInput" }
        - type: object
          required: [isDemo, botConnected, paymentsConnected, paymentProvider]
          properties:
            isDemo: { type: boolean }
            botConnected: { type: boolean }
            paymentsConnected: { type: boolean }
            paymentProvider: { type: string }
