openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Telecart shop administration. Live Telegram and payments are not connected.
servers:
  - url: /api
tags:
  - name: health
  - name: shop
paths:
  /shop/advertising/account/app:
    put:
      operationId: saveAdvertisingAppCredentials
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingAppCredentialsInput"}}}}
      responses:
        "200": {description: Saved one-time app setup, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
    delete:
      operationId: forgetAdvertisingAppCredentials
      responses:
        "200": {description: Stopped advertising and removed app setup and session, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/account/login:
    post:
      operationId: beginAdvertisingAccountLogin
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingAccountLoginInput"}}}}
      responses:
        "200": {description: Secure login challenge, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
    delete:
      operationId: cancelAdvertisingAccountLogin
      responses:
        "200": {description: Cancelled login, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/account/login/verify:
    post:
      operationId: verifyAdvertisingAccountLogin
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingAccountVerification"}}}}
      responses:
        "200": {description: Code/password verification, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/account/login/poll:
    post:
      operationId: pollAdvertisingAccountLogin
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingAccountPoll"}}}}
      responses:
        "200": {description: QR login state, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/account/check:
    post:
      operationId: checkAdvertisingAccount
      responses:
        "200": {description: Account session check, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/account/emoji-set:
    post:
      operationId: loadAdvertisingEmojiSet
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingEmojiSetInput"}}}}
      responses:
        "200": {description: Read-only custom emoji pack lookup, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingEmojiSet"}}}}
  /shop/advertising/account:
    delete:
      operationId: disconnectAdvertisingAccount
      responses:
        "200": {description: Stopped posting and removed session, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/schedules/start:
    post:
      operationId: startAdvertisingAccountSchedules
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingAccountStartInput"}}}}
      responses:
        "200": {description: Selected groups started, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/schedules/stop:
    post:
      operationId: stopAdvertisingAccountSchedules
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingScheduleSelection"}}}}
      responses:
        "200": {description: Selected groups stopped, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/schedules/stop-all:
    post:
      operationId: stopAllAdvertisingAccountSchedules
      responses:
        "200": {description: All groups stopped, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising:
    get:
      operationId: getAdvertisingWorkspace
      responses:
        "200": {description: Advertising workspace, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/connection:
    post:
      operationId: connectAdvertisingBot
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingConnectionInput"}}}}
      responses:
        "200": {description: Verified connection, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
    delete:
      operationId: disconnectAdvertisingBot
      responses:
        "200": {description: Disconnected, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/connection/check:
    post:
      operationId: checkAdvertisingBot
      responses:
        "200": {description: Connection check, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/groups/discover:
    post:
      operationId: discoverAdvertisingGroups
      responses:
        "200": {description: Discover recent group additions, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/groups/preview:
    post:
      operationId: previewAdvertisingGroups
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingImportInput"}}}}
      responses:
        "200": {description: Segregated import, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingImportPreview"}}}}
  /shop/advertising/groups:
    post:
      operationId: addAdvertisingGroups
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingGroupsInput"}}}}
      responses:
        "200": {description: Saved groups, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/groups/check:
    post:
      operationId: checkAdvertisingGroups
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingGroupSelection"}}}}
      responses:
        "200": {description: Posting permission checks, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/groups/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateAdvertisingGroup
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingGroupUpdate"}}}}
      responses:
        "200": {description: Updated group, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
    delete:
      operationId: deleteAdvertisingGroup
      responses:
        "200": {description: Removed group, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/draft:
    put:
      operationId: saveAdvertisingDraft
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingDraft"}}}}
      responses:
        "200": {description: Saved message, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/advertising/campaigns:
    post:
      operationId: startAdvertisingCampaign
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingCampaignInput"}}}}
      responses:
        "201": {description: Queued campaign, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingCampaign"}}}}
  /shop/advertising/campaigns/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAdvertisingCampaign
      responses:
        "200": {description: Delivery results, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingCampaignDetail"}}}}
  /shop/advertising/campaigns/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: cancelAdvertisingCampaign
      responses:
        "200": {description: Stopped unsent deliveries, content: {application/json: {schema: {$ref: "#/components/schemas/AdvertisingWorkspace"}}}}
  /shop/product-groups:
    get:
      operationId: listProductGroups
      tags: [shop]
      responses:
        "200":
          description: Products with independently priced and stocked options.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProductGroup" } }
    post:
      operationId: createProductGroup
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductGroupInput" }
      responses:
        "201":
          description: Group created; existing option IDs and inventory are preserved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroup" }
        "400": { description: Invalid options }
        "409": { description: An option already belongs to another group }
  /shop/product-groups/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateProductGroup
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductGroupInput" }
      responses:
        "200":
          description: Group and options updated atomically. Saved options must remain included; archive rather than silently dropping them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroup" }
        "404": { description: Group not found }
        "409": { description: Conflicting option ownership or omitted saved option }
    delete:
      operationId: deleteProductGroup
      tags: [shop]
      responses:
        "204": { description: Deleted group and all options including unsold inventory }
        "409": { description: Order history or reserved/delivered stock exists; archive options instead }
  /shop/custom-emojis:
    get:
      operationId: listCustomEmojis
      tags: [shop]
      responses:
        "200":
          description: The signed-in shop's imported custom emoji library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomEmojiLibrary" }
        "401": { description: Sign-in required }
  /shop/custom-emojis/pack:
    post:
      operationId: importCustomEmojiPack
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmojiPackInput" }
      responses:
        "200":
          description: Verified custom emoji pack imported without duplicate entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmojiImportResult" }
        "400": { description: Invalid link or not a custom emoji pack }
        "401": { description: Sign-in required }
        "403": { description: Not the bot owner or invalid origin }
        "503": { description: Telegram connection required }
  /shop/custom-emojis/session:
    post:
      operationId: startEmojiImport
      tags: [shop]
      responses:
        "200":
          description: Private ten-minute link for importing emojis through Telegram.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmojiImportLink" }
        "401": { description: Sign-in required }
        "503": { description: Enable Telegram processing first }
    delete:
      operationId: stopEmojiImport
      tags: [shop]
      responses:
        "204": { description: Current import link and Telegram pairing revoked }
        "401": { description: Sign-in required }
  /shop/custom-emojis/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]{1,30}$' }
    delete:
      operationId: deleteCustomEmoji
      tags: [shop]
      responses:
        "204": { description: Removed from library; products using it revert to normal emoji }
        "401": { description: Sign-in required }
        "404": { description: Emoji not in your library }
  /shop/custom-emojis/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]{1,30}$' }
    get:
      operationId: previewCustomEmoji
      tags: [shop]
      responses:
        "200":
          description: Private static thumbnail; no bot token is exposed.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { description: Sign-in required }
        "404": { description: Preview unavailable }
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [shop]
      responses:
        "200":
          description: Current admin session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCredentials" }
      responses:
        "200":
          description: Admin signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { description: Invalid credentials }
        "429": { description: Too many attempts }
  /admin/logout:
    post:
      operationId: logoutAdmin
      tags: [shop]
      responses:
        "204": { description: Session revoked }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /shop/overview:
    get:
      operationId: getOverview
      tags: [shop]
      responses:
        "200":
          description: Shop overview or explicitly labelled public sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
  /shop/products:
    get:
      operationId: listProducts
      tags: [shop]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }
    post:
      operationId: createProduct
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /shop/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateProduct
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [shop]
      responses:
        "204": { description: Deleted }
  /shop/products/{id}/inventory:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: listInventory
      tags: [shop]
      responses:
        "200":
          description: Metadata only, no plaintext credentials
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/InventoryItem" } }
    post:
      operationId: importInventory
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryInput" }
      responses:
        "201":
          description: Imported securely
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
  /shop/inventory/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      operationId: deleteInventoryItem
      tags: [shop]
      responses:
        "204": { description: Deleted }
  /shop/orders:
    get:
      operationId: listOrders
      tags: [shop]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
  /shop/orders/{id}/delivery:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revealOrderDelivery
      tags: [shop]
      responses:
        "200":
          description: Exact delivered inventory, visible only to the owning admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDelivery" }
        "400": { description: Invalid order reference }
        "401": { description: Sign-in required }
        "403": { description: Cross-origin access denied }
        "404": { description: Delivered inventory unavailable }
  /shop/customers:
    get:
      operationId: listCustomers
      tags: [shop]
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Customer" } }
  /shop/deposits:
    get:
      operationId: listDeposits
      tags: [shop]
      responses:
        "200":
          description: Deposits
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Deposit" } }
  /shop/deposits/{id}/cancel:
    post:
      operationId: cancelDeposit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Cancelled the deposit flow without stopping verification of late transfers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositCancellation" }
        "400": { description: Invalid deposit reference }
        "401": { description: Sign in required }
        "404": { description: Deposit not found in this shop }
        "409": { description: Deposit is already settled or closed }
  /shop/data-transfer:
    get:
      operationId: getShopTransferStatus
      responses:
        "200":
          description: Destination readiness and safety requirements.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopTransferStatus" }
        "401": { description: Sign in required }
  /shop/data-transfer/export:
    post:
      operationId: exportShopData
      responses:
        "200":
          description: One-time portable shop data ZIP.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { description: Sign in required }
        "413": { description: Transfer limit exceeded }
  /shop/data-transfer/preview:
    post:
      operationId: previewShopData
      requestBody:
        required: true
        content:
          application/zip:
            schema: { $ref: "#/components/schemas/ShopTransferZip" }
      responses:
        "200":
          description: Verified ZIP contents and destination blockers. No rows changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopTransferPreview" }
        "400": { description: Invalid or unauthenticated archive }
        "401": { description: Sign in required }
        "413": { description: ZIP exceeds transfer limit }
  /shop/data-transfer/import:
    post:
      operationId: importShopData
      parameters:
        - { name: X-Transfer-Token, in: header, required: true, schema: { type: string } }
        - { name: X-Transfer-Confirm, in: header, required: true, schema: { type: string, enum: [IMPORT EMPTY SHOP] } }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { $ref: "#/components/schemas/ShopTransferZip" }
      responses:
        "200":
          description: All records imported atomically; processing paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopTransferResult" }
        "400": { description: Invalid archive or missing confirmation }
        "401": { description: Sign in required }
        "409": { description: "Nonempty destination, expired preview or conflict. No changes committed." }
        "413": { description: ZIP exceeds transfer limit }
  /shop/data-transfer/review:
    post:
      operationId: reviewShopData
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopTransferReview" }
      responses:
        "200":
          description: Review acknowledged; Telegram remains disabled until explicitly enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopTransferReviewResult" }
        "400": { description: Acknowledgement required }
        "401": { description: Sign in required }
  /shop/activity:
    get:
      operationId: listActivity
      tags: [shop]
      responses:
        "200":
          description: Recent shop events
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Activity" } }
  /shop/settings:
    get:
      operationId: getSettings
      tags: [shop]
      responses:
        "200":
          description: Nonsecret settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopSettings" }
    put:
      operationId: saveSettings
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopSettings" }
  /shop/integration:
    get:
      operationId: getIntegration
      responses:
        "200":
          description: Safe connection diagnostics for the signed-in shop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationStatus" }
  /shop/integration/runtime:
    post:
      operationId: updateTelegramRuntime
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramRuntimeInput" }
      responses:
        "200":
          description: Saved Telegram operation settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationStatus" }
  /shop/integration/credentials/telegram:
    post:
      operationId: saveTelegramCredential
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramCredentialInput" }
      responses:
        "200":
          description: Token was verified with Telegram and encrypted for the signed-in shop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramCredentialResult" }
  /shop/integration/credentials/nowpayments:
    post:
      operationId: saveNowpaymentsCredentials
      tags: [shop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NOWPaymentsCredentialInput" }
      responses:
        "200":
          description: API key was verified and both values were encrypted for the signed-in shop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NOWPaymentsCredentialResult" }
  /shop/payment-minimums:
    get:
      operationId: getPaymentMinimums
      tags: [shop]
      responses:
        "200":
          description: Current provider minimums for this merchant route
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMinimum" }
  /shop/integration/connect:
    post:
      operationId: connectIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationInput" }
      responses:
        "200":
          description: Verified provider configuration and current Telegram activation state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationStatus" }
  /shop/integration/disconnect:
    post:
      operationId: disconnectIntegration
      responses:
        "204": { description: Telegram disconnected; pending payments remain reconcilable. }
  /shop/payment-attempts:
    get:
      operationId: listPaymentAttempts
      responses:
        "200":
          description: Real payment attempts, with no delivered credentials.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentAttempt" }
  /shop/payment-attempts/{id}/check:
    post:
      operationId: checkPaymentAttempt
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authoritatively checked with NOWPayments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentAttempt" }
components:
  schemas:
    AdvertisingDraft:
      type: object
      required: [text, imageUrl, buttonText, buttonUrl]
      properties:
        text: {type: string, maxLength: 4096}
        imageUrl: {type: [string, "null"], maxLength: 2048}
        buttonText: {type: string, maxLength: 64}
        buttonUrl: {type: [string, "null"], maxLength: 2048}
        entities: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/AdvertisingTextEntity"}}
    AdvertisingTextEntity:
      type: object
      required: [type, offset, length]
      properties:
        type: {type: string, enum: [bold, italic, text_link, custom_emoji]}
        offset: {type: integer, minimum: 0}
        length: {type: integer, minimum: 1}
        url: {type: string, maxLength: 2048}
        documentId: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
    AdvertisingEmojiSetInput:
      type: object
      required: [link]
      properties:
